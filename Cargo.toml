[package]
name = "sidenote"
version = "0.2.0"
edition = "2024"
description = "Per-repo scratch notes in your terminal, stored outside the repo"
repository = "https://github.com/gaspb/sidenote"
license = "MIT"
keywords = ["notes", "tui", "cli", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
diffy = "0.5"
ratatui = "0.30"
ratatui-textarea = "0.9"
serde_json = "1.0.154"
unicode-width = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
