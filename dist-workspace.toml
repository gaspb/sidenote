[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Installs `sidenote-update` next to sidenote: `sidenote update` runs it
install-updater = true
# Also publish the crate to crates.io (see .github/workflows/publish-crates.yml)
publish-jobs = ["./publish-crates"]
# crates.io trusted publishing needs an OIDC token
github-custom-job-permissions = { "publish-crates" = { id-token = "write" } }
# release.yml is hand-patched: dist 0.34 renders local publish jobs as "$/..." instead of "./..."
allow-dirty = ["ci"]
