# Called by release.yml (cargo-dist) after the GitHub Release is built.
# Uses crates.io trusted publishing: no token stored in the repo.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if this version is already on crates.io
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "sidenote-release (github.com/gaspb/sidenote)" \
              "https://crates.io/api/v1/crates/sidenote/$version" > /dev/null; then
            echo "sidenote $version is already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.skip != 'true'
        id: auth
      - run: cargo publish
        if: steps.check.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
